<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a7de1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Missão Bolsa">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>Missão Bolsa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important} *{box-sizing:border-box}
/* Layout: a single trail ("trilha") column — kid picker on top, one task at a time, big tap targets. Painel do pai is a denser grid. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --ink:#1d2433; --muted:#5d6678; --line:#dde3ee;
  --maia:#8e5bd0; --maia-soft:#efe6fb; --jaq:#2a7de1; --jaq-soft:#e2eefc;
  --good:#1f9d63; --good-soft:#e1f5ea; --bad:#d64545; --bad-soft:#fbe6e6; --gold:#e3a008;
  --accent:var(--jaq); --accent-soft:var(--jaq-soft);
  --font-display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121722; --surface:#1b2230; --ink:#eef1f7; --muted:#a3acbd; --line:#2c3546;
  --maia:#c4a2f5; --maia-soft:#2e2442; --jaq:#5aa2ff; --jaq-soft:#1c2c45;
  --good:#3ccf8a; --good-soft:#163527; --bad:#ff7070; --bad-soft:#3d1f22; --gold:#f5c044; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121722; --surface:#1b2230; --ink:#eef1f7; --muted:#a3acbd; --line:#2c3546;
  --maia:#c4a2f5; --maia-soft:#2e2442; --jaq:#5aa2ff; --jaq-soft:#1c2c45;
  --good:#3ccf8a; --good-soft:#163527; --bad:#ff7070; --bad-soft:#3d1f22; --gold:#f5c044; color-scheme:dark}
body.k-maia{--accent:var(--maia);--accent-soft:var(--maia-soft)}
body.k-jaquinho{--accent:var(--jaq);--accent-soft:var(--jaq-soft)}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:17px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:700}
h2{font-size:22px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.kids{display:flex;gap:8px}
.kid{font:700 16px var(--font-body);border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;cursor:pointer;display:flex;align-items:center;gap:8px}
.kid .dot{width:12px;height:12px;border-radius:50%}
.kid[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{font:700 15px var(--font-body);border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:12px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--ink);font-variant-numeric:tabular-nums}
.btn{font:700 17px var(--font-body);border:0;border-radius:14px;padding:14px 22px;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;color:var(--muted);font-size:14px}
.tag{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.texto{background:var(--bg);border-left:4px solid var(--accent);padding:12px 14px;border-radius:10px;font-size:16px}
.qtext{font-size:20px;font-weight:700}
.opts{display:grid;gap:10px}
.opt{font:600 18px var(--font-body);text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:800;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.tag.ref{background:#f6ead0;color:#7a4f00}
.opt:disabled{cursor:default}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b{font-family:var(--font-display);font-size:19px}
.big{font-family:var(--font-display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px}
.skills{display:grid;gap:10px}
.skill{display:grid;grid-template-columns:minmax(0,1fr) 110px 56px;gap:10px;align-items:center;font-size:15px}
.skill .bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.skill .bar i{display:block;height:100%;border-radius:999px}
.skill .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b0{background:var(--line);color:var(--muted)}
.b1{background:var(--bad-soft);color:var(--bad)}
.b2{background:#f6ead0;color:#8a5a00}
.b3{background:var(--good-soft);color:var(--good)}
:root[data-theme="dark"] .b2{background:#3b3017;color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .b2{background:#3b3017;color:var(--gold)}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.lesson{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.lesson.focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ex{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px}
.dica{font-size:15px;color:var(--muted)}
details.mais{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
details.mais > summary,details.resp > summary{cursor:pointer;font-weight:800;color:var(--accent);list-style:revert}
details.mais h4{font-family:var(--font-display);font-size:16px;margin:12px 0 4px}
details.mais ol,details.mais ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
details.mais .ex{margin-top:6px}
details.resp{background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-top:6px}
.pratica{align-self:flex-start;font-size:15px;padding:10px 14px;margin-top:4px}
.chart{width:100%;height:auto}
.note{font-size:13px;color:var(--muted)}
.focuslist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.focuslist li{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{font:700 14px var(--font-body);border:0;background:var(--surface);color:var(--ink);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
[hidden]{display:none!important}
.opt.pend{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--surface))}
.pressa{border:2px solid var(--gold);border-radius:12px;padding:10px 12px;font-weight:700;background:color-mix(in srgb,var(--gold) 12%,var(--surface))}
.extra{border:2px dashed var(--accent);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--accent-soft)}
.extra h4{font-family:var(--font-display);font-size:16px;margin:4px 0 0}
.links{font-size:14px;color:var(--muted)} .links a{color:var(--accent);font-weight:700}
.tblw{overflow-x:auto} table.tbl{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap} table.tbl th{color:var(--muted);font-weight:700}
.login{max-width:420px;margin:24px auto;width:100%}
.login label{display:flex;flex-direction:column;gap:6px;font-weight:700}
.login input{font:600 18px var(--font-body);padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.login input:focus{outline:none;border-color:var(--accent)}
.erro{color:var(--bad);font-weight:700;min-height:1.2em}
.userbox{display:flex;gap:8px;align-items:center}
.mini{font:700 14px var(--font-body);border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.medalhas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.medalha{border:2px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;font-size:13px;opacity:.75}
.medalha b{font-size:15px} .medalha.on{border-color:var(--gold);opacity:1;background:color-mix(in srgb,var(--gold) 10%,var(--surface))}
.festa{border:2px solid var(--gold);border-radius:12px;padding:10px 14px;background:color-mix(in srgb,var(--gold) 12%,var(--surface));font-weight:700;width:100%}
.confete{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.confete i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:cai linear forwards}
@keyframes cai{to{top:105vh;transform:rotate(720deg)}}
@media (max-width:700px){.medalhas{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid2{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.skill{grid-template-columns:minmax(0,1fr) 70px 48px}h1{font-size:25px}.qtext{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--accent)"/><path d="M20 8l3.6 7.4 8.1 1.2-5.9 5.7 1.4 8.1L20 26.6l-7.2 3.8 1.4-8.1-5.9-5.7 8.1-1.2z" fill="#fff"/></svg>
      <div><h1>Missão Bolsa</h1><p class="muted" id="sub">Treino diário de Português e Matemática</p></div>
    </div>
    <div class="kids" role="group" aria-label="Quem vai treinar">
      <button class="kid" id="kid-maia" data-kid="maia"><span class="dot" style="background:var(--maia)"></span>Maya</button>
      <button class="kid" id="kid-jaquinho" data-kid="jaquinho"><span class="dot" style="background:var(--jaq)"></span>Jaquinho</button>
    </div>
    <div class="userbox" id="userbox" hidden><span class="pill" id="quem"></span><button class="mini" id="sair">Sair</button></div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-treino" data-view="treino">Treino do dia</button>
    <button class="tab" role="tab" id="tab-evolucao" data-view="evolucao">Minha evolução</button>
    <button class="tab" role="tab" id="tab-estudar" data-view="estudar">Para estudar</button>
    <button class="tab" role="tab" id="tab-painel" data-view="painel">Painel do pai</button>
  </nav>
  <main id="view"></main>
  <p class="note" id="savenote">Carregando o histórico…</p>
</div>

<script>
/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const N = n => Number(n).toLocaleString('pt-BR');
const gcd = (a,b) => b ? gcd(b,a%b) : a;
const lcm = (a,b) => a/gcd(a,b)*b;
const reais = c => 'R$ ' + (c/100).toFixed(2).replace('.',',');
const dec2 = c => (c/100).toFixed(2).replace('.',',');
const hora = m => { const h=Math.floor(m/60)%24, mm=m%60; return h+'h'+String(mm).padStart(2,'0'); };
const frac = (n,d) => { const g=gcd(Math.abs(n),Math.abs(d)); n/=g; d/=g; return d===1 ? String(n) : n+'/'+d; };
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Monta uma questão de múltipla escolha a partir da resposta certa e de erros comuns. */
function autoFill(c){
  const m=c.match(/^(R\$ )?([\d.]+(?:,\d+)?)(.*)$/); if(!m || m[3].startsWith('/')) return null;
  const dec=(m[2].split(',')[1]||'').length, v=parseFloat(m[2].replace(/\./g,'').replace(',','.'));
  const step = dec ? 1 : Math.max(1, Math.round(Math.abs(v)*0.1));
  return k => { const nv=v+(k%2?1:-1)*step*Math.ceil(k/2); if(nv<0) return '-'; return (m[1]||'')+(dec? nv.toFixed(dec).replace('.',',') : N(nv))+m[3]; };
}
function mc(correct, wrongs, fill){
  const c = String(correct); fill = fill || autoFill(c); const set = new Set([c]); const opts=[c];
  for(const w of wrongs){ const s=String(w); if(!set.has(s) && s!=='NaN' && !/^(R\$ )?-/.test(s)){ set.add(s); opts.push(s); } if(opts.length===4) break; }
  let k=1; while(opts.length<4 && fill){ const s=String(fill(k++)); if(!set.has(s) && !/^(R\$ )?-/.test(s)){ set.add(s); opts.push(s);} if(k>40) break; }
  const sh = shuffle(opts); return { options: sh, a: sh.indexOf(c) };
}

/* ================= perfis ================= */
const KIDS = {
  maia: { nome:'Maya', serieDefault:4, ola:'Oi, linda do papai!',
    vivas:['Arrasou, linda do papai!','Acertou! Isso merece um brigadeiro (o papai vai querer metade).','Resposta mais caprichada que make de festa!','Tocou certinho, igual no órgão!','Linda e inteligente! Agora o papai não tem do que tirar sarro.','Essa foi de lamber os dedos!','A mamãe vai ficar toda orgulhosa!','Acertou! Conta pra mamãe no jantar.','Isso merece um reels com a mamãe!','Essa resposta viralizou!'],
    forca:['Errou? O papai vai tirar sarro no jantar… Bora corrigir antes! Olha:','Quase, linda! Até a make mais caprichada precisa de retoque. Veja o truque:','Mais uma dessa e vai ter que trocar a fralda do James! Brincadeira… olha só:','A mamãe ia rir dessa… mas depois ia te explicar assim:','Errar faz parte, até da trend mais famosa. Olha o truque:'] },
  jaquinho: { nome:'Jaquinho', serieDefault:7, ola:'E aí, Jaquinho? O papai está de olho.',
    vivas:['Centrado como sempre.','O papai sério aprova.','Afinadíssimo, igual violino bem afinado.','Essa nem o Daniel errava. Ou errava?','Mandou bem, nível bolsa!','Isso que é raciocínio.','Até a mamãe ficou sem piada pra essa.','Com esse raciocínio, até a mamãe ia te chamar para ajudar a dominar o mundo.'],
    forca:['Errou essa? Amanhã vou pedir para a mamãe te levar na escola. Brincadeira… olha o truque:','Essa o Daniel chutaria. Você é mais centrado, olha:','Errou? Hoje é você quem dá a mamadeira pro James, com ele segurando no seu braço. Veja o truque:','Desafinou um pouquinho. Afina assim:','Errou? A mamãe vai fazer piada disso no café da manhã. Antes, olha o truque:'] }
};

/* ================= habilidades ================= */
const SKILLS = {
  maia: {
    valor_posicional:{nome:'Valor posicional',mat:true}, adicao:{nome:'Adição',mat:true}, subtracao:{nome:'Subtração',mat:true},
    multiplicacao:{nome:'Multiplicação',mat:true}, divisao:{nome:'Divisão',mat:true}, fracoes:{nome:'Frações',mat:true},
    dinheiro:{nome:'Dinheiro e troco',mat:true}, tempo:{nome:'Horas e minutos',mat:true}, perimetro:{nome:'Perímetro',mat:true},
    ortografia:{nome:'Ortografia'}, pontuacao:{nome:'Pontuação'}, classes:{nome:'Tipos de palavras'},
    sinonimos:{nome:'Sinônimos e antônimos'}, plural:{nome:'Singular e plural'}, interpretacao:{nome:'Interpretação de texto'}
  },
  jaquinho: {
    expressoes:{nome:'Expressões numéricas',mat:true}, potencias:{nome:'Potências',mat:true}, mmc_mdc:{nome:'MMC e MDC',mat:true},
    fracoes_soma:{nome:'Soma de frações',mat:true}, fracao_quantidade:{nome:'Fração de quantidade',mat:true}, decimais:{nome:'Números decimais',mat:true},
    porcentagem:{nome:'Porcentagem',mat:true}, area:{nome:'Área',mat:true}, divisibilidade:{nome:'Divisibilidade',mat:true},
    interpretacao:{nome:'Interpretação de texto'}, classes:{nome:'Classes de palavras'}, ortografia:{nome:'Ortografia'},
    acentuacao:{nome:'Acentuação'}, concordancia:{nome:'Concordância'}, sentido:{nome:'Linguagem figurada'},
    pontuacao:{nome:'Pontuação'}, verbos:{nome:'Verbos'}
  }
};

/* ================= geradores de Matemática ================= */
const casas = ['unidades','dezenas','centenas','unidades de milhar','dezenas de milhar'];
const GEN = {
  maia: {
    valor_posicional(L){
      let n,ds,i,d;
      do{ n = L>=5 ? rnd(10000,99999) : rnd(1000,9999); ds=String(n).split('').map(Number); i=rnd(0,ds.length-2); d=ds[i]; }while(d===0 || ds.filter(x=>x===d).length>1);
      const pos = ds.length-1-i, v = d*10**pos;
      return { q:`No número ${N(n)}, quanto vale o algarismo ${d}?`, ...mc(N(v),[N(d),N(d*10**(pos-1)),N(d*10**(pos+1))]),
        ex:`O ${d} está na casa das ${casas[pos]}. Por isso ele vale ${N(v)}.` };
    },
    adicao(L){
      let a,b; do{ a = L>=5?rnd(1000,6999):rnd(120,799); b = L>=5?rnd(1000,2999):rnd(110,199+L*20); }while((a%10+b%10)<10);
      const s=a+b; const A=String(a).padStart(5,'0'), B=String(b).padStart(5,'0'); let sv=''; for(let k=0;k<5;k++) sv+=(+A[k]+ +B[k])%10; const semVaiUm=+sv;
      const v = pick([`Para a festa, a confeitaria fez ${N(a)} brigadeiros de manhã e ${N(b)} à tarde. Quantos brigadeiros ao todo?`,`O reels da Maya com a mamãe teve ${N(a)} curtidas no sábado e ${N(b)} no domingo. Quantas curtidas ao todo?`,`No recital de órgão, ${N(a)} pessoas vieram no sábado e ${N(b)} no domingo. Quantas pessoas no total?`,`Quanto é ${N(a)} + ${N(b)}?`]);
      return { q:v, ...mc(N(s),[N(semVaiUm),N(s+10),N(s-10),N(s+100)]), ex:`${N(a)} + ${N(b)} = ${N(s)}. Quando a soma de uma coluna passa de 9, o "vai um" sobe para a coluna da esquerda.` };
    },
    subtracao(L){
      let a,b; do{ a=L>=5?rnd(2000,9999):rnd(300,999); b=L>=5?rnd(1000,a-100):rnd(100,a-40); }while(a%10>=b%10);

/* ================= banco de Português unificado (PT antigo + PTX novo) ================= */
const BANCO_PT={};
function bancoPT(k){
  if(BANCO_PT[k]) return BANCO_PT[k];
  const lista=PT[k].map(([s,q,ops,ex,tx],i)=>({skill:s,qid:k+'-pt-'+i,q,ops,ex,tx}));
  for(const [s,l] of Object.entries(PTX[k]||{})) l.forEach(([q,ops,ex,tx],j)=>lista.push({skill:s,qid:k+'-ptx-'+s+'-'+j,q,ops,ex,tx}));
  const map={}; lista.forEach(o=>map[o.qid]=o);
  return BANCO_PT[k]={lista,map};
}

/* SHA-256 (só para não deixar as senhas escritas no código; não é segurança de banco). */
function sha256(txt){
  let ascii=unescape(encodeURIComponent(txt));
  const rr=(v,a)=>(v>>>a)|(v<<(32-a)), max=Math.pow(2,32), words=[], bits=ascii.length*8;
  let hash=[], k=[], pc=0; const comp={};
  for(let c=2;pc<64;c++){ if(!comp[c]){ for(let i=0;i<313;i+=c) comp[i]=c; hash[pc]=(Math.pow(c,.5)*max)|0; k[pc++]=(Math.pow(c,1/3)*max)|0; } }
  hash=hash.slice(0,8); ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(let i=0;i<ascii.length;i++) words[i>>2]|=ascii.charCodeAt(i)<<((3-i)%4)*8;
  words[words.length]=(bits/max)|0; words[words.length]=bits;
  for(let j=0;j<words.length;){
    const w=words.slice(j,j+=16), old=hash; hash=hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      const t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(let i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  let out=''; for(let i=0;i<8;i++) for(let j=3;j+1;j--){ const b=(hash[i]>>(j*8))&255; out+=(b<16?'0':'')+b.toString(16); }
  return out;
}

/* ================= degraus do troco (Maya) ================= */
/* 1 = reais inteiros · 2 = centavos ,00/,50 · 3 = centavos quebrados. Sobe depois de 4 acertos seguidos no degrau; desce depois de 3 erros seguidos. */
function degrauTroco(){
  let nv=1, ok=0, er=0;
  for(const i of itemsDe('maia').filter(i=>i.skill==='dinheiro' && i.nv)){
    if(i.nv!==nv) continue;
    if(i.ok){ ok++; er=0; if(ok>=4 && nv<3){ nv++; ok=0; } }
    else { er++; ok=0; if(er>=3 && nv>1){ nv--; er=0; } }
  }
  return nv;
}

/* ================= v11 — soma de frações em 3 etapas (Jaquinho, até ficar verde) ================= */
const emEtapas=()=>{ const m=maestria('jaquinho').fracoes_soma; return m.n<3 || m.m<.75; };
const multiplosAte=(n,lim)=>{ const r=[]; for(let x=n;x<=lim;x+=n) r.push(x); return r.join(', '); };
function etapasFracoes(){
  let b,d,m; do{ b=rnd(2,10); d=rnd(2,10); m=lcm(b,d); }while(b===d || m>40);
  const a=rnd(1,b-1), c=rnd(1,d-1), x=a*m/b, y=c*m/d, val=(n,dd)=>n/dd, certo=frac(x+y,m);
  const conta=`${a}/${b} + ${c}/${d}`;
  const e1={ q:`Etapa 1 de 3 — Para somar ${conta}, primeiro precisamos de um denominador comum. Qual é o MMC de ${b} e ${d}?`, ...mc(m,[b*d,b+d,Math.max(b,d),m*2]),
    ex:`Múltiplos de ${b}: ${multiplosAte(b,m)}. Múltiplos de ${d}: ${multiplosAte(d,m)}. O primeiro em comum é ${m}.` };
  const e2={ q:`Etapa 2 de 3 — Com o denominador ${m}, como fica ${conta}?`, ...mc(`${x}/${m} + ${y}/${m}`,[`${a}/${m} + ${c}/${m}`,`${a*(m/d)}/${m} + ${c*(m/b)}/${m}`,`${x}/${m} + ${c}/${m}`,`${a+m/b}/${m} + ${c+m/d}/${m}`],k=>`${x+k}/${m} + ${y+(k%2)}/${m}`),
    ex:`${m} ÷ ${b} = ${m/b}, então ${a}/${b} = ${a}×${m/b} / ${m} = ${x}/${m}. ${m} ÷ ${d} = ${m/d}, então ${c}/${d} = ${y}/${m}. O que multiplica embaixo, multiplica em cima.` };
  const erradas=[frac(x+y,2*m),frac(a+c,b+d),frac(x+y+1,m),frac(x+y,m+1),frac(Math.max(1,x+y-1),m)].filter(w=>{ const [n,dd]=(w+'/1').split('/').map(Number); return Math.abs(val(n,dd)-val(x+y,m))>1e-9; });
  const e3={ q:`Etapa 3 de 3 — Agora é só somar: ${x}/${m} + ${y}/${m} = ? (simplifique se der)`, ...mc(certo,erradas,k=>frac(x+y+k+1,m)),
    ex:`Com o mesmo denominador, soma só os de cima e mantém o de baixo: ${x} + ${y} = ${x+y} → ${x+y}/${m}${certo!==(x+y)+'/'+m?' = '+certo+' (simplificado)':''}.` };
  return [e1,e2,e3].map((g,i)=>({skill:'fracoes_soma',qid:'fracoes_soma-e'+(i+1),q:g.q,options:g.options,a:g.a,ex:g.ex,etapa:i+1}));
}

/* Busca todos os treinos da planilha (junta com os que ainda estão na fila deste tablet). */
async function initDb(){
  if(!apiOk()){ storeMode='local'; note(); render(); return; }
  try{
    const r = await fetch(API_URL+'?token='+encodeURIComponent(TOKEN)+'&acao=dados',{cache:'no-store'}).then(x=>x.json());
    if(!r.ok) throw new Error(r.erro);
    const porId = new Map(r.sessoes.map(x=>[x.id,x]));
    fila().filter(x=>x.acao==='salvarSessao').forEach(x=>porId.set(x.sessao.id,x.sessao));   // o que está na fila é mais novo
    sessions = [...porId.values()];
    if(run && run.resp.some(x=>x!=null)) sessions = sessions.filter(x=>x.id!==run.id).concat(sessoesRunAtual());
    if(r.config && r.config.maiaSerie) cfg.maiaSerie = Number(r.config.maiaSerie);
    if(r.config && r.config.papaiHash) cfg.papaiHash = String(r.config.papaiHash);
    if(r.config && r.config.metaSemana) cfg.metaSemana = Number(r.config.metaSemana);
    if(r.config && r.config.premioSemana) cfg.premioSemana = String(r.config.premioSemana);
    storeMode='db'; saveLocal();
  }catch(e){ storeMode='offline'; }
  note(); if(!run) render(); enviarFila();
}
/* Envia o que estiver pendente (treinos feitos sem internet também chegam depois). */
let enviando=false;
async function enviarFila(){
  if(!apiOk() || enviando) return; enviando=true;
  try{
    let q=fila();
    while(q.length){
      const item=q[0];
      const r = await fetch(API_URL,{method:'POST',body:JSON.stringify(Object.assign({token:TOKEN},item))}).then(x=>x.json());
      if(!r.ok) break;
      q=fila().filter(x=>x.fid!==item.fid); setFila(q);   // relê a fila: pode ter entrado coisa nova enquanto enviava
    }
    storeMode = q.length ? 'offline' : 'db';
  }catch(e){ storeMode='offline'; }
  enviando=false; note();
}

const novoFid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

  const q=fila().filter(x=>!(x.acao==='salvarSessao' && x.sessao.id===s.id)); q.push({fid:novoFid(),acao:'salvarSessao',sessao:s}); setFila(q);
}
function sessoesRunAtual(){ return run && !run.fim ? [sessaoDoRun(true)] : []; }
async function saveSession(s){ upsertSession(s); await enviarFila(); }
async function saveCfg(extra){ saveLocal(); const q=fila(); q.push({fid:novoFid(),acao:'salvarConfig',config:Object.assign({maiaSerie:cfg.maiaSerie},extra||{})}); setFila(q); await enviarFila(); }

/* ================= métricas ================= */
const serieDe = k => k==='maia' ? (cfg.maiaSerie||4) : 7;
function itemsDe(k){ return sessions.filter(s=>s.kid===k).sort((a,b)=>a.ts-b.ts).flatMap(s=>s.items.map(i=>({...i,date:s.date}))); }
function maestria(k){
  /* Questão de Português repetida (já respondida antes) vale meio ponto: decorar a resposta não infla o domínio. */
  const visto=new Set(), it=itemsDe(k).filter(i=>!i.e).map(i=>{ let w=1; if(!SKILLS[k][i.skill]?.mat){ if(visto.has(i.qid)) w=.5; visto.add(i.qid); } return {...i,w}; }), out={};
  for(const sk of Object.keys(SKILLS[k])){ const l=it.filter(i=>i.skill===sk).slice(-12); const c=l.reduce((a,i)=>a+(i.ok?i.w:0),0), wn=l.reduce((a,i)=>a+i.w,0); out[sk]={n:l.length,c,wn,m:(c+1)/(wn+2)}; }
  return out;
}
function nivel(s){ if(s.n<3) return {t:'Novo',c:'b0'}; if(s.m<.5) return {t:'Treinar mais',c:'b1'}; if(s.m<.75) return {t:'Quase lá',c:'b2'}; return {t:'Dominado',c:'b3'}; }
function sequencia(k){
  const dias=new Set(sessions.filter(s=>s.kid===k).map(s=>s.date)); let n=0; const d=new Date();
  if(!dias.has(today())) d.setDate(d.getDate()-1);
  for(;;){ const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); if(dias.has(key)){ n++; d.setDate(d.getDate()-1);} else break; }
  return n;
}
function acerto(k,mat){ const it=itemsDe(k).filter(i=>!i.e && !!SKILLS[k][i.skill]?.mat===mat).slice(-40); return it.length? Math.round(100*it.filter(i=>i.ok).length/it.length) : null; }
function foco(k,n=3){ const m=maestria(k); return Object.entries(m).sort((a,b)=>(a[1].n<3?.55:a[1].m)-(b[1].n<3?.55:b[1].m)).slice(0,n).map(([sk])=>sk); }

/* ================= montagem do treino ================= */
const diasEntre=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
/* Reforço com repetição espaçada: o que errou volta depois de 1 dia; acertou, volta depois de 3; acertou de novo, está fixado. */
function devidos(k){
  const st={};
  for(const s of sessions.filter(x=>x.kid===k).sort((a,b)=>a.ts-b.ts)) for(const it of s.items){
    const mat=!!SKILLS[k][it.skill]?.mat; const key=mat?'sk:'+it.skill:it.qid;
    if(!it.ok) st[key]={nivel:0,last:s.date,skill:it.skill,qid:it.qid,mat};
    else if(st[key] && s.date>st[key].last){ st[key].nivel++; st[key].last=s.date; if(st[key].nivel>=2) delete st[key]; }
  }
  const hoje=today();
  return Object.values(st).filter(x=>diasEntre(x.last,hoje)>=(x.nivel===0?1:3)).sort((a,b)=>a.last<b.last?-1:1);
}
function questaoPT(k,o,extra){ const sh=shuffle(o.ops); return {skill:o.skill,qid:o.qid,q:o.q,texto:o.tx?TX[o.tx]:null,options:sh,a:sh.indexOf(o.ops[0]),ex:o.ex,...extra}; }
function questaoMat(k,sk,extra){ const nv=(k==='maia'&&sk==='dinheiro')?degrauTroco():undefined; const g=GEN[k][sk](serieDe(k),nv); return {skill:sk,qid:sk+'-gen',q:g.q,options:g.options,a:g.a,ex:g.ex,...(nv?{nv}:{}),...extra}; }
/* Quando a criança viu cada questão de Português pela última vez (-1 = nunca viu). */
function ultimaVez(k){ const m={}; itemsDe(k).forEach((i,n)=>m[i.qid]=n); return q=>q in m?m[q]:-1; }
function escolherPT(k,banco,uv){ if(!banco.length) return null; const nunca=banco.filter(o=>uv(o.qid)<0); if(nunca.length) return pick(nunca); return pick([...banco].sort((a,b)=>uv(a.qid)-uv(b.qid)).slice(0,3)); }
function montarTreino(k,tipo='treino'){
  const nMat = tipo==='simulado' ? (k==='jaquinho'?15:10) : 5, nPt=nMat;
  const m=maestria(k), skills=Object.keys(SKILLS[k]);
  const B=bancoPT(k), uv=ultimaVez(k);
  const qs=[]; const usados=new Set(); let fMat=nMat, fPt=nPt; const cont={};
  if(tipo==='treino'){
    for(const d of devidos(k).slice(0,3)){
      if(d.mat && fMat>0){ qs.push(questaoMat(k,d.skill,{reforco:true})); fMat--; cont[d.skill]=(cont[d.skill]||0)+1; }
      else if(!d.mat && fPt>0){ const o=B.map[d.qid]; if(o){ qs.push(questaoPT(k,o,{reforco:true})); usados.add(o.qid); fPt--; cont[d.skill]=(cont[d.skill]||0)+1; } }
    }
  }
  const peso=sk=>{ if(tipo==='simulado') return 1; const s=m[sk]; return s.n<3 ? 1 : Math.pow(1-s.m,1.5)+0.12; };
  const lim = tipo==='simulado' ? 3 : 2;
  const sortear=pool=>{ const tot=pool.reduce((a,s)=>a+peso(s),0); let r=Math.random()*tot; for(const s of pool){ r-=peso(s); if(r<=0) return s; } return pool[pool.length-1]; };
  const mats=skills.filter(s=>SKILLS[k][s].mat), pts=skills.filter(s=>!SKILLS[k][s].mat);
  const escolhidas=[];
  for(const t of [...Array(fMat).fill('mat'),...Array(fPt).fill('pt')]){ let pool=(t==='mat'?mats:pts).filter(s=>(cont[s]||0)<lim); if(!pool.length) pool=t==='mat'?mats:pts; const sk=sortear(pool); cont[sk]=(cont[sk]||0)+1; escolhidas.push(sk); }
  /* Maya com Português acima de 90%: pelo menos 2 das 5 de Português são de interpretação (textos maiores, como na prova). */
  if(k==='maia' && tipo==='treino' && (acerto(k,false)??0)>=90){ let ni=escolhidas.filter(s=>s==='interpretacao').length; for(let i=0;i<escolhidas.length && ni<2;i++){ if(!SKILLS[k][escolhidas[i]].mat && escolhidas[i]!=='interpretacao'){ escolhidas[i]='interpretacao'; ni++; } } }
  for(const sk of escolhidas){
    if(k==='jaquinho' && sk==='fracoes_soma' && tipo==='treino' && emEtapas()) qs.push({skill:sk,grupo:etapasFracoes()});
    else if(SKILLS[k][sk].mat) qs.push(questaoMat(k,sk,{}));
    else{
      const o=escolherPT(k,B.lista.filter(o=>o.skill===sk && !usados.has(o.qid)),uv) || escolherPT(k,B.lista.filter(o=>!usados.has(o.qid)),uv);
      if(o){ usados.add(o.qid); qs.push(questaoPT(k,o,{})); }
    }
  }
  return tipo==='simulado' ? qs.sort((a,b)=>(SKILLS[k][b.skill].mat?1:0)-(SKILLS[k][a.skill].mat?1:0)) : shuffle(qs).flatMap(q=>q.grupo||[q]);
}
function montarPratica(k,sk){
  if(k==='jaquinho' && sk==='fracoes_soma' && emEtapas()) return [...etapasFracoes(),...Array.from({length:4},()=>questaoMat(k,sk,{}))];
  if(SKILLS[k][sk].mat) return Array.from({length:5},()=>questaoMat(k,sk,{}));
  const uv=ultimaVez(k);
  return shuffle(bancoPT(k).lista.filter(o=>o.skill===sk)).sort((a,b)=>uv(a.qid)-uv(b.qid)).slice(0,5).map(o=>questaoPT(k,o,{}));
}
function iniciarRun(qs,tipo){ const t0=Date.now(); run={id:kid+'-'+t0,kid,qs,i:0,resp:[],tq:[],rap:[],t0,qT0:t0,tipo}; }
function novaRun(tipo){ iniciarRun(montarTreino(kid,tipo),tipo); render(); }
const mmss=sec=>Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');

/* ================= desenho ================= */
function estrela(on,size=28){ return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${on?'var(--gold)':'var(--line)'}"/></svg>`; }
function setKid(k){ if(!ehPai()) return; salvarParcial(); kid=k; try{localStorage.setItem(LS+'-kid',k);}catch(e){} run=null; render(); }
function setView(v){ if(v==='painel' && !ehPai()) return; if(v!=='treino'){ salvarParcial(); run=null; } view=v; render(); }
function sair(){ salvarParcial(); run=null; user=null; view='treino'; try{ localStorage.removeItem(LSU); }catch(e){} render(); }
function entrar(u){ user=u; try{ localStorage.setItem(LSU,u); }catch(e){} if(u!=='papai'){ kid=u; if(view==='painel') view='treino'; } else view='painel'; run=null; render(); window.scrollTo({top:0}); }

function render(){
  if(user && user!=='papai') kid=user;
  document.body.className='k-'+kid;
  $('.kids').hidden = !ehPai(); $('#tab-painel').hidden = !ehPai(); $('nav.tabs').hidden = !user; $('#userbox').hidden = !user;
  if(user) $('#quem').textContent = ehPai() ? 'Papai' : KIDS[kid].nome;
  if(!user){ $('#sub').textContent='Treino diário de Português e Matemática'; $('#view').innerHTML=telaLogin(); ligarLogin(); return; }
  document.querySelectorAll('.kid').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.kid===kid)));
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.view===view)));
  $('#sub').textContent = view==='painel' ? 'Painel do pai: onde cada um precisa focar' : `Treino diário de Português e Matemática · ${KIDS[kid].nome}, ${serieDe(kid)}º ano em 2027`;
  const v=$('#view');
  if(view==='treino') v.innerHTML = run ? (run.fim ? telaFim() : telaQuestao()) : telaInicio();
  else if(view==='evolucao') v.innerHTML = telaEvolucao(kid, false);
  else if(view==='estudar') v.innerHTML = telaEstudar();
  else v.innerHTML = telaPainel();
  ligar();
}

function telaLogin(){

  <form id="flogin" class="login" style="margin:0;display:flex;flex-direction:column;gap:14px" autocomplete="on">

function telaQuestao(){

  const letras='ABCD';

    if(resp==null && run.pend===j) cls='pend';
    return `<button class="opt ${cls}" id="opt-${j}" data-j="${j}" ${resp!=null?'disabled':''}><span class="l">${letras[j]}</span><span>${esc(o)}</span></button>`; }).join('');
  const pressa = resp==null && run.pend!=null ? `<div class="pressa" role="status" id="pressa">Opa, foi rápido demais! ${kid==='maia'?'Leu tudo com calma, linda?':'Leu o enunciado inteiro?'} Se tiver certeza, toque de novo na mesma resposta. Se não, troque.</div>` : '';

    <div class="progress" aria-hidden="true"><i style="width:${(run.i+(resp!=null?1:0))/run.qs.length*100}%"></i></div>

    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${opts}</div>
    ${pressa}${fb}
    ${resp!=null?`<div class="row"><button class="btn" id="next">${run.i+1<run.qs.length?'Próxima':'Ver resultado'}</button></div>`:''}
  </section>`;
}

function telaFim(){
  const c=run.qs.filter((q,i)=>run.resp[i]===q.a).length, t=run.qs.length, pct=Math.round(100*c/t), st=pct>=90?3:pct>=70?2:pct>=50?1:0;
  const erradas=run.qs.map((q,i)=>({q,i})).filter(o=>run.resp[o.i]!==o.q.a);
  const errSk=[...new Set(erradas.map(o=>o.q.skill))];
  if(run.tipo==='refazer') return `<section class="card" style="align-items:center;text-align:center"><p class="muted">Refazendo as que errou</p><div class="big">${c}<span class="muted" style="font-size:28px"> / ${t}</span></div><h2>${c===t?'Agora foi! Essas questões voltam daqui a alguns dias para fixar de vez.':'Quase! Essas voltam como reforço nos próximos treinos.'}</h2><div class="row" style="justify-content:center"><button class="btn" id="estudar-erros">Estudar o que errei</button><button class="btn ghost" id="voltar">Voltar ao início</button></div></section>`;
  const msg = c===t?'Gabaritou! Isso é nível bolsa!': pct>=70?'Mandou muito bem! Faltou pouquinho.': pct>=50?'Bom treino! Amanhã tem mais.':'Treino é para isso: agora a gente sabe o que estudar.';

  return `<section class="card" style="align-items:center;text-align:center">
    ${(run.festa||[]).map(f=>`<div class="festa">${esc(f)}</div>`).join('')}
    <p class="muted">${sim?`Simulado da prova · ${mmss(run.dur||0)}`: run.tipo==='pratica'?`Prática de ${SKILLS[kid][run.qs[0].skill].nome}`:'Resultado de hoje'}</p>

    ${gab}
  </section>`;
}

function barras(k){
  const m=maestria(k);
  return Object.entries(SKILLS[k]).map(([sk,s])=>({sk,s,v:m[sk]})).sort((a,b)=>(a.v.n<3?.55:a.v.m)-(b.v.n<3?.55:b.v.m)).map(({sk,s,v})=>{ const nv=nivel(v); const pct=v.n?Math.round(100*v.c/v.wn):0;
    const col = v.n<3?'var(--line)': v.m<.5?'var(--bad)': v.m<.75?'var(--gold)':'var(--good)';
    return `<div class="skill"><span>${s.nome} <span class="muted" style="font-size:13px">· ${s.mat?'Mat':'Port'}</span></span><span class="bar"><i style="width:${v.n?Math.max(6,pct):0}%;background:${col}"></i></span><span class="badge ${nv.c}">${v.n?pct+'%':'—'}</span></div>`; }).join('');
}

function grafico(k){
  const dias=[]; const d=new Date(); for(let i=13;i>=0;i--){ const x=new Date(d); x.setDate(d.getDate()-i); dias.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')); }
  const W=640,H=170,L=34,B=26,T=12; const bw=(W-L-8)/14;
  const dados=dias.map(dd=>{ const it=sessions.filter(s=>s.kid===k&&s.date===dd).flatMap(s=>s.items); return it.length? Math.round(100*it.filter(i=>i.ok).length/it.length):null; });
  const y=v=>T+(H-T-B)*(1-v/100);
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Acertos por dia nas últimas duas semanas">`;
  for(const v of [0,50,100]) g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="var(--muted)">${v}%</text>`;
  dados.forEach((v,i)=>{ const x=L+4+i*bw; if(v!=null) g+=`<rect x="${x}" y="${y(v)}" width="${bw-6}" height="${y(0)-y(v)}" rx="4" fill="var(--accent)"/><text x="${x+(bw-6)/2}" y="${y(v)-4}" font-size="10" text-anchor="middle" fill="var(--ink)">${v}</text>`; else g+=`<rect x="${x}" y="${y(0)-3}" width="${bw-6}" height="3" rx="1.5" fill="var(--line)"/>`;
    if(i%2===1||i===13) g+=`<text x="${x+(bw-6)/2}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--muted)">${dias[i].slice(8)}/${dias[i].slice(5,7)}</text>`; });
  return g+'</svg>';
}

    <button class="btn ghost pratica" data-sk="${sk}">Praticar este assunto (5 questões)</button></article>`; }).join('')}</div>`;

function tabelaDias(k){
  const ss=sessions.filter(s=>s.kid===k), dias=[...new Set(ss.map(s=>s.date))].sort().reverse().slice(0,10);
  if(!dias.length) return '';
  const pc=it=>it.length?Math.round(100*it.filter(i=>i.ok).length/it.length)+'%':'';
  const grp=(S,t)=>{ const g=S.filter(s=>(s.tipo||'treino')===t), it=g.flatMap(s=>s.items); return g.length?`${g.length} · ${it.length} q · ${pc(it)}`:'—'; };
  const segQ=S=>{ const it=S.flatMap(s=>s.items), ct=it.filter(i=>i.t!=null); if(ct.length) return Math.round(ct.reduce((a,i)=>a+i.t,0)/ct.length)+' s'; return it.length?Math.round(S.reduce((a,s)=>a+(s.dur||0),0)/it.length)+' s*':'—'; };
  const rap=S=>{ const ct=S.flatMap(s=>s.items).filter(i=>i.t!=null); return ct.length?Math.round(100*ct.filter(i=>i.r).length/ct.length)+'%':'—'; };
  const linhas=dias.map(d=>{ const S=ss.filter(s=>s.date===d), tot=S.reduce((a,s)=>a+(s.dur||0),0), par=S.filter(s=>s.parcial).length;
    return `<tr><td>${d.slice(8)}/${d.slice(5,7)}</td><td>${grp(S,'treino')}</td><td>${grp(S,'pratica')}</td><td>${grp(S,'simulado')}</td><td>${Math.round(tot/60)} min</td><td>${segQ(S)}</td><td>${rap(S)}</td><td>${par||'—'}</td></tr>`; }).join('');
  const sem=ss.filter(s=>diasEntre(s.date,today())<7), itS=sem.flatMap(s=>s.items);
  return `<h3>Treino e prática por dia</h3>
    <p>Últimos 7 dias: <strong>${sem.filter(s=>(s.tipo||'treino')==='treino').length}</strong> treinos e <strong>${sem.filter(s=>s.tipo==='pratica').length}</strong> práticas · ${itS.length} questões · ${Math.round(sem.reduce((a,s)=>a+(s.dur||0),0)/60)} min no total · ${segQ(sem)} por questão · respostas rápidas demais: ${rap(sem)}.</p>
    <div class="tblw"><table class="tbl"><thead><tr><th>Dia</th><th>Treinos (qtd · questões · acerto)</th><th>Práticas</th><th>Simulado</th><th>Tempo</th><th>Seg/questão</th><th>Rápidas demais</th><th>Saiu no meio</th></tr></thead><tbody>${linhas}</tbody></table></div>
    <p class="note">"Rápidas demais" = respondeu em menos de 4 segundos (7 com texto) e precisou confirmar. Saiu no meio = trocou de aba, saiu ou fechou antes de terminar: o que respondeu ficou salvo. * média estimada pela duração do treino (antes de medir questão por questão).</p>`;
}
function telaPainel(){
  const bloco=k=>{ const K=KIDS[k], nS=sessions.filter(s=>s.kid===k).length, ult=sessions.filter(s=>s.kid===k).sort((a,b)=>b.ts-a.ts)[0];
    const f=foco(k,3), m=maestria(k);
    return `<section class="card">
      <div class="row" style="justify-content:space-between"><h2 style="color:var(--${k==='maia'?'maia':'jaq'})">${K.nome}</h2>
      ${k==='maia'?`<div class="seg" role="group" aria-label="Série da Maya em 2027"><button id="serie4" data-serie="4" aria-pressed="${cfg.maiaSerie===4}">4º ano</button><button id="serie5" data-serie="5" aria-pressed="${cfg.maiaSerie===5}">5º ano</button></div>`:'<span class="pill">7º ano em 2027</span>'}</div>
      <div class="row"><span class="pill">${nS} ${nS===1?'treino':'treinos'}</span><span class="pill">${sequencia(k)} ${sequencia(k)===1?'dia seguido':'dias seguidos'}</span><span class="pill">Mat ${acerto(k,true)??'—'}%</span><span class="pill">Port ${acerto(k,false)??'—'}%</span>${ult?`<span class="pill">Último: ${ult.date.slice(8)}/${ult.date.slice(5,7)}</span>`:''}</div>
      ${(()=>{ const rv=devidos(k).length, sims=sessions.filter(x=>x.kid===k&&x.tipo==='simulado').sort((a,b)=>b.ts-a.ts).slice(0,5); return `<p>Reforço pendente: <strong>${rv}</strong> ${rv===1?'questão':'questões'} que ${K.nome} errou e que voltam nos próximos treinos.</p>${sims.length?`<p>Simulados: ${sims.map(x=>`${x.date.slice(8)}/${x.date.slice(5,7)} → <strong>${x.score}/${x.items.length}</strong> (${Math.round(100*x.score/x.items.length)}%)`).join(' · ')}</p>`:'<p class="muted">Nenhum simulado completo ainda.</p>'}`; })()}
      ${k==='maia'?`<p>Troco em degraus: Maya está no <strong>degrau ${degrauTroco()} de 3</strong> (1 = reais inteiros · 2 = ,00 e ,50 · 3 = centavos quebrados). Sobe com 4 acertos seguidos.</p>`:''}
      ${k==='jaquinho'?(()=>{ const it=itemsDe(k).filter(i=>i.e), nm=['MMC','converter','somar']; return `<p>Soma de frações ${emEtapas()?'<strong>em 3 etapas</strong> (até ficar verde)':'já dominada: voltou ao formato normal'}.${it.length?' Acerto por etapa: '+[1,2,3].map(e=>{ const l=it.filter(i=>i.e===e); return `${nm[e-1]} ${l.length?Math.round(100*l.filter(i=>i.ok).length/l.length)+'% ('+l.length+')':'—'}`; }).join(' · ')+'.':''}</p>`; })():''}
      <p>Conquistas: ${medalhas(k).lista.map(x=>`${x.nome} ${x.ok?'✓':'('+x.prog+')'}`).join(' · ')}.</p>
      ${tabelaDias(k)}
      <h3>Foco agora</h3>
      <ul class="focuslist">${f.map(sk=>{ const v=m[sk]; return `<li><span>${SKILLS[k][sk].nome} <span class="muted" style="font-size:13px">· ${SKILLS[k][sk].mat?'Matemática':'Português'}</span></span><span class="badge ${nivel(v).c}">${v.n?Math.round(100*v.c/v.wn)+'% em '+v.n:'ainda não treinou'}</span></li>`; }).join('')}</ul>
      ${nS?grafico(k):''}
      <div class="skills">${barras(k)}</div>
    </section>`; };
  return `<section class="card"><p>Como funciona o reforço: o treino diário escolhe mais questões dos assuntos fracos, e toda questão errada volta depois de 1 dia; se acertar, volta de novo depois de 3 dias; acertando de novo, conta como fixada. O simulado semanal mede como estão no formato da prova. Na prova de bolsa do Objetivo e do Etapa caem Português e Matemática, com o conteúdo da série que eles estão terminando.</p><p class="note">Ainda faltam confirmar com as escolas a data da prova e o edital. Quando chegarem, os treinos são ajustados.</p></section>${bloco('jaquinho')}${bloco('maia')}
  <section class="card"><h3>Meta da família</h3><p class="muted">Soma as questões dos dois de segunda a domingo. Esta semana: ${metaFamilia().n} de ${metaFamilia().meta}.</p>
  <div class="row"><label class="muted">Meta (questões)<br><input id="metaq" type="number" min="20" step="10" value="${metaFamilia().meta}" style="width:120px;font:600 16px var(--font-body);padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)"></label>
  <label class="muted" style="flex:1 1 220px">Prêmio<br><input id="metap" value="${esc(metaFamilia().premio)}" style="width:100%;font:600 16px var(--font-body);padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)"></label>
  <button class="btn ghost" id="salvameta" style="align-self:flex-end">Salvar meta</button></div><p class="note" id="msgmeta"></p></section>
  <section class="card"><h3>Senha do papai</h3><p class="muted">${cfg.papaiHash?'Senha personalizada ativa.':'Ainda é a senha provisória "papai". Troque por uma que as crianças não saibam.'} A troca vale para todos os aparelhos.</p>
  <div class="row"><input id="ns1" type="password" placeholder="Nova senha" autocomplete="new-password" style="font:600 16px var(--font-body);padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)"><input id="ns2" type="password" placeholder="Repita a senha" autocomplete="new-password" style="font:600 16px var(--font-body);padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)"><button class="btn ghost" id="trocasenha">Trocar senha</button></div><p class="note" id="msgsenha"></p></section>`;
}

/* ================= eventos ================= */
let tick=null;
function ligar(){
  clearInterval(tick); if(run && run.tipo==='simulado' && !run.fim) tick=setInterval(()=>{ const el=$('#timer'); if(el) el.textContent=mmss(Math.round((Date.now()-run.t0)/1000)); },1000);
  $('#start')?.addEventListener('click',()=>novaRun('treino'));
  document.querySelectorAll('.pratica').forEach(b=>b.addEventListener('click',()=>{ iniciarRun(montarPratica(kid,b.dataset.sk),'pratica'); view='treino'; render(); window.scrollTo({top:0}); }));
  $('#simulado')?.addEventListener('click',()=>novaRun('simulado'));
  document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(run.resp[run.i]!=null) return; const j=+b.dataset.j, dt=(Date.now()-run.qT0)/1000;
    if(dt<limPressa(run.qs[run.i]) && run.pend!==j){ run.pend=j; run.rap[run.i]=true; render(); return; }   // freio de pressa: pede para confirmar
    run.resp[run.i]=j; run.tq[run.i]=Math.round(dt*10)/10; run.pend=null;
    const q=run.qs[run.i];
    /* Errou no treino ou na prática: entra logo depois uma questão gêmea (mesmo assunto, outros números). Até 3 por treino. */
    if(j!==q.a && (run.tipo==='treino'||run.tipo==='pratica') && !q.gemea && !q.etapa && (run.gemeas||0)<3){
      let g=null;
      if(SKILLS[kid][q.skill].mat) g=questaoMat(kid,q.skill,{gemea:true});
      else { const usados=new Set(run.qs.map(x=>x.qid)); const o=escolherPT(kid,bancoPT(kid).lista.filter(o=>o.skill===q.skill && !usados.has(o.qid)),ultimaVez(kid)); if(o) g=questaoPT(kid,o,{gemea:true}); }
      if(g){ run.qs.splice(run.i+1,0,g); run.gemeas=(run.gemeas||0)+1; q.temGemea=true; }
    }
    render(); $('#next')?.focus();
  }));
  $('#next')?.addEventListener('click',async()=>{
    if(run.i+1<run.qs.length){ run.i++; run.qT0=Date.now(); run.pend=null; render(); window.scrollTo({top:0}); return; }
    run.dur=Math.round((Date.now()-run.t0)/1000);
    if(run.tipo==='refazer'){ run.fim=true; render(); return; }
    const antesMed=medalhasOk(kid), antesMeta=metaFamilia(), jaTinhaHoje=sessions.some(x=>x.kid===kid&&x.date===today()&&!x.parcial&&x.id!==run.id);
    const s=sessaoDoRun(false); upsertSession(s);
    const M=medalhas(kid), novas=M.lista.filter(x=>x.ok && !antesMed.includes(x.id)), depoisMeta=metaFamilia(), seq=sequencia(kid);
    run.festa=[];
    if(s.items.length>=5 && s.score===s.items.length) run.festa.push('Gabaritou! Nenhum erro!');
    novas.forEach(x=>run.festa.push(`Nova conquista: ${x.nome}! (${x.regra})`));
    if(novas.length && M.lista.every(x=>x.ok)) run.festa.push(M.fim);
    if(antesMeta.n<antesMeta.meta && depoisMeta.n>=depoisMeta.meta) run.festa.push(`Meta da família batida! Prêmio liberado: ${depoisMeta.premio}.`);
    if(!jaTinhaHoje && seq>=2) run.festa.push(`${seq} dias seguidos de treino!`);
    run.fim=true; render(); if(run.festa.length) confete(); await enviarFila();
  });
  $('#again')?.addEventListener('click',()=>{ if(run && (run.tipo==='simulado'||run.tipo==='pratica')){ run=null; render(); } else novaRun('treino'); });
  $('#voltar')?.addEventListener('click',()=>{ run=null; render(); });
  $('#refazer')?.addEventListener('click',()=>{ const qs=run.qs.filter((q,i)=>run.resp[i]!==q.a).map(q=>{ const correta=q.options[q.a]; const sh=shuffle(q.options); return {...q,options:sh,a:sh.indexOf(correta),reforco:false}; }); iniciarRun(qs,'refazer'); render(); window.scrollTo({top:0}); });
  $('#estudar-erros')?.addEventListener('click',()=>{ const e=[...new Set(run.qs.filter((q,i)=>run.resp[i]!==q.a).map(q=>q.skill))]; run=null; view='estudar'; render(); $('#view').innerHTML=telaEstudar(e.length?e:null); window.scrollTo({top:0,behavior:'smooth'}); });
  document.querySelectorAll('[data-serie]').forEach(b=>b.addEventListener('click',()=>{ cfg.maiaSerie=+b.dataset.serie; saveCfg(); render(); }));
  $('#salvameta')?.addEventListener('click',()=>{ const n=Math.round(+$('#metaq').value), p=$('#metap').value.trim();
    if(!(n>=20)){ $('#msgmeta').textContent='Use uma meta de pelo menos 20 questões.'; return; }
    cfg.metaSemana=n; cfg.premioSemana=p||'pizza em família'; saveCfg({metaSemana:cfg.metaSemana,premioSemana:cfg.premioSemana}); render(); $('#msgmeta').textContent='Meta salva para os dois tablets.'; });
  $('#trocasenha')?.addEventListener('click',()=>{ const a=$('#ns1').value.trim(), b=$('#ns2').value.trim(), msg=$('#msgsenha');
    if(a.length<4){ msg.textContent='Use pelo menos 4 caracteres.'; return; } if(a!==b){ msg.textContent='As duas senhas não estão iguais.'; return; }
    cfg.papaiHash=hashSenha('papai',a); saveCfg({papaiHash:cfg.papaiHash}); render(); $('#msgsenha').textContent='Senha trocada. Na próxima vez, entre com a nova.'; });
}
document.querySelectorAll('.kid').forEach(b=>b.addEventListener('click',()=>setKid(b.dataset.kid)));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$('#sair').addEventListener('click',sair);
if(user==='papai') view='painel';
render(); note(); const dbPronto=initDb();
</script>
